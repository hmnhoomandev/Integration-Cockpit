name: Verify cockpit

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  regression:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.12', '3.14']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install local PDF extractor
        run: sudo apt-get update && sudo apt-get install -y poppler-utils tesseract-ocr tesseract-ocr-deu tesseract-ocr-fra
      - name: Compile and run regressions
        run: |
          python -m compileall -q cockpit
          python -m unittest discover -s tests -v

  container:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build and verify synthetic container
        run: |
          set -eu
          docker build -t integration-cockpit:ci .
          password="$(python3 -c 'import secrets; print(secrets.token_urlsafe(20))')"
          docker run -d --name cockpit-ci -p 127.0.0.1:8080:8080 --env "COCKPIT_PASSWORD=$password" \
            --entrypoint sh integration-cockpit:ci -c 'python -m cockpit.server account ci-judge judge && unset COCKPIT_PASSWORD && exec python -m cockpit.server serve --hosted --bind 0.0.0.0 --port 8080'
          trap 'docker rm -f cockpit-ci >/dev/null' EXIT
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:8080/health | grep -Fx ok; then break; fi
            if [ "$attempt" -eq 30 ]; then docker logs cockpit-ci; exit 1; fi
            sleep 1
          done
          test "$(curl --silent --output /dev/null --write-out "%{http_code}" http://127.0.0.1:8080/export)" = 303
          docker exec cockpit-ci python -c 'from pathlib import Path; from cockpit.intake import suggest; result = suggest(Path("cockpit/synthetic-intake.pdf").read_bytes(), {"SYN-Z00001":"DEMO-00001"}); assert result["mode"] == "review" and result["suggestions"] == ["scheduling"]'
